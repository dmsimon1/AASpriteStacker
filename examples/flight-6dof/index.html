<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>SkyStack — 6-DOF Anti-Aliased Sprite-Stacking Flight Demo (@aastack/core)</title>
<style>
  :root {
    --target-size: 30px;
    --ui-bg-light: rgba(255, 255, 255, 0.86);
    --ui-bg-dark: rgba(13, 19, 30, 0.80);
    --ui-border-light: rgba(15, 23, 42, 0.16);
    --ui-border-dark: rgba(226, 232, 240, 0.18);
    --ui-text-light: #0f172a;
    --ui-text-dark: #f1f5f9;
    --accent-light: #1d4ed8;
    --accent-dark: #38bdf8;
    --accent-text-light: #ffffff;
    --accent-text-dark: #06131f;

    --ui-bg: var(--ui-bg-dark);
    --ui-border: var(--ui-border-dark);
    --ui-text: var(--ui-text-dark);
    --accent: var(--accent-dark);
    --accent-text: var(--accent-text-dark);

    @media (prefers-color-scheme: light) {
      --ui-bg: var(--ui-bg-light);
      --ui-border: var(--ui-border-light);
      --ui-text: var(--ui-text-light);
      --accent: var(--accent-light);
      --accent-text: var(--accent-text-light);
    }
    @supports (color: light-dark(white, black)) {
      --ui-bg: light-dark(var(--ui-bg-light), var(--ui-bg-dark));
      --ui-border: light-dark(var(--ui-border-light), var(--ui-border-dark));
      --ui-text: light-dark(var(--ui-text-light), var(--ui-text-dark));
      --accent: light-dark(var(--accent-light), var(--accent-dark));
      --accent-text: light-dark(var(--accent-text-light), var(--accent-text-dark));
    }
    color-scheme: dark light;
    accent-color: var(--accent);
  }

  @media (pointer: coarse) {
    :root { --target-size: 46px; }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100dvh; width: 100%; background: #0c1726;
    font: 13px/1.35 ui-sans-serif, -apple-system, system-ui, sans-serif;
    color: var(--ui-text);
    overscroll-behavior: none;
  }

  #stage {
    position: relative; width: 100%; height: 100dvh; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    content-visibility: auto;
    contain-intrinsic-size: auto none auto 100dvh;
  }

  #glCanvas, #hudCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  #hudCanvas { pointer-events: none; z-index: 2; }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    padding:
      max(10px, env(safe-area-inset-top, 10px))
      max(12px, env(safe-area-inset-right, 12px))
      8px
      max(12px, env(safe-area-inset-left, 12px));
    pointer-events: none;
  }
  .bar-group {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; pointer-events: auto;
  }
  .pill-brand {
    padding: 6px 10px; border-radius: 8px; background: var(--ui-bg);
    border: 1px solid var(--ui-border); backdrop-filter: blur(10px);
    font-weight: 700; letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: 7px;
  }
  .chip {
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700;
    padding: 3px 5px; border-radius: 4px; background: var(--accent); color: var(--accent-text);
  }

  button {
    appearance: none; min-block-size: var(--target-size); min-inline-size: var(--target-size);
    padding: 6px 11px; border-radius: 8px;
    border: 1px solid var(--ui-border); background: var(--ui-bg); color: var(--ui-text);
    backdrop-filter: blur(10px); font: 600 12px/1.1 inherit; cursor: pointer;
    transition: transform 80ms ease, background-color 120ms ease;
  }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
  }

  /* Split-Screen A/B Comparison Overlay */
  #splitOverlay { position: absolute; inset: 0; pointer-events: none; z-index: 4; display: none; }
  #splitOverlay.visible { display: block; }
  #splitHandle {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
    pointer-events: auto; cursor: ew-resize; transform: translateX(-1px);
  }
  .split-knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 38px; height: 38px; border-radius: 999px;
    background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 800; font-size: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  }
  .split-tag {
    position: absolute; top: max(62px, calc(env(safe-area-inset-top, 10px) + 52px));
    padding: 4px 9px; border-radius: 6px; background: var(--ui-bg); border: 1px solid var(--ui-border);
    font: 600 11px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; backdrop-filter: blur(8px);
  }
  .split-tag.left { left: max(12px, env(safe-area-inset-left, 12px)); }
  .split-tag.right { right: max(12px, env(safe-area-inset-right, 12px)); border-color: var(--accent); }

  /* Bottom Telemetry & Control Hint Bar */
  .bottom-meta {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding:
      0
      max(12px, env(safe-area-inset-right, 12px))
      max(10px, env(safe-area-inset-bottom, 10px))
      max(12px, env(safe-area-inset-left, 12px));
  }
  .hint-pill {
    padding: 4px 10px; border-radius: 999px;
    background: rgba(9, 14, 24, 0.72); color: #e2e8f0;
    font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: center; backdrop-filter: blur(6px);
  }
  #statsBar {
    font: 10px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(241, 245, 249, 0.85); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }

  /* Mobile Multi-Touch Virtual Stick & Right-Thumb Action Pad */
  #stickBase {
    position: absolute; width: 96px; height: 96px; border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.45); background: rgba(15, 23, 42, 0.28);
    transform: translate(-50%, -50%); opacity: 0; pointer-events: none; z-index: 5;
    display: grid; place-items: center; transition: opacity 100ms ease;
  }
  #stickKnob {
    width: 40px; height: 40px; border-radius: 999px;
    background: rgba(56, 189, 248, 0.82); border: 2px solid #fff;
  }

  .mobile-actions {
    position: absolute; right: max(14px, env(safe-area-inset-right, 14px));
    bottom: max(76px, calc(env(safe-area-inset-bottom, 14px) + 68px));
    display: none; flex-direction: column; gap: 10px; z-index: 6;
  }
  @media (pointer: coarse), (max-width: 760px) {
    .mobile-actions { display: flex; }
  }
  #stage.cockpit-mode .bottom-meta {
    bottom: 146px;
  }
  @media (max-width: 640px) {
    #stage.cockpit-mode .bottom-meta {
      bottom: 104px;
    }
  }
  .touch-action {
    width: 66px; height: 66px; border-radius: 999px; font-weight: 800; font-size: 11px;
    letter-spacing: 0.04em; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  .touch-action.boost { background: rgba(234, 88, 12, 0.88); color: #fff; border-color: rgba(255, 237, 213, 0.5); }
  .touch-action.boost[aria-pressed="true"] { background: #f97316; transform: scale(0.94); }

  /* AI-First Live SceneIR & Time-Travel Inspector Drawer */
  #inspectorDrawer {
    position: absolute; left: max(12px, env(safe-area-inset-left, 12px));
    top: max(62px, calc(env(safe-area-inset-top, 10px) + 52px));
    width: min(310px, calc(100vw - 24px)); max-height: 60dvh; overflow: auto;
    padding: 10px; border-radius: 10px; background: var(--ui-bg); border: 1px solid var(--ui-border);
    backdrop-filter: blur(12px); z-index: 7; display: none;
  }
  #inspectorDrawer.open { display: block; }
  .ir-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .ir-actions button { min-block-size: 30px; padding: 4px 8px; font-size: 11px; }
  #irPreview {
    margin: 0; font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* Subtle Co-Editing "Agent Live" Pill (?bridge=1 or IR toggle) */
  #agentPill {
    position: absolute; left: max(12px, env(safe-area-inset-left, 12px));
    top: max(56px, calc(env(safe-area-inset-top, 10px) + 46px));
    z-index: 6; display: none; align-items: center; gap: 8px; max-width: min(360px, calc(100vw - 24px));
    padding: 5px 9px; border-radius: 999px; background: var(--ui-bg);
    border: 1px solid var(--ui-border); backdrop-filter: blur(10px);
    font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #agentPill.visible { display: inline-flex; }
  .agent-dot {
    width: 8px; height: 8px; border-radius: 999px; flex: none; background: #94a3b8;
  }
  #agentPill[data-state="connected"] .agent-dot {
    background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.85);
  }
  #agentPill[data-state="connecting"] .agent-dot { background: #f59e0b; }
  #agentMsg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #agentUndoBtn {
    min-block-size: 24px; min-inline-size: 24px; padding: 3px 8px; border-radius: 999px;
    font-size: 10px; display: none;
  }
  #agentUndoBtn.visible { display: inline-block; }
</style>
</head>
<body>
<main id="stage">
  <canvas id="glCanvas" role="img" aria-label="6-DOF Anti-Aliased Sprite-Stacking Flight World"></canvas>
  <canvas id="hudCanvas" aria-hidden="true"></canvas>

  <header class="top-bar">
    <div class="bar-group">
      <div class="pill-brand">
        <span>SkyStack</span>
        <span class="chip">@aastack/core</span>
      </div>
    </div>
    <div class="bar-group hud-interactive">
      <button id="camBtn" title="Cycle Overhead / Chase / Cockpit (Space or V)">Cam: Chase</button>
      <button id="styleBtn" title="Cycle Render Style: 8-Bit AA / HD-2D / Smooth Toy / Retro 1× (M)">Style: 8-Bit AA</button>
      <button id="splitBtn" aria-pressed="false" title="Toggle Retro 1× vs AA Split Curtain (C)">A/B</button>
      <button id="todBtn" title="Cycle Day / Sunset / Night">Day</button>
      <button id="inspectorBtn" aria-pressed="false" title="Live SceneIR & Deterministic Replay">IR</button>
    </div>
  </header>

  <div id="splitOverlay">
    <div id="splitHandle" style="left: 50%"><div class="split-knob">⇄</div></div>
    <div class="split-tag left" id="tagLeft">Retro 1×</div>
    <div class="split-tag right" id="tagRight">8-Bit AA · 8×</div>
  </div>

  <div id="agentPill" class="hud-interactive" data-state="disconnected" aria-live="polite">
    <span class="agent-dot" aria-hidden="true"></span>
    <span id="agentMsg">Agent Bridge: Connecting…</span>
    <button id="agentUndoBtn" title="Undo last agent edit">Undo</button>
  </div>

  <aside id="inspectorDrawer" class="hud-interactive" aria-label="Live SceneIR Inspector">
    <div class="ir-actions">
      <button id="snapBtn">Snapshot</button>
      <button id="restoreBtn" disabled>Rewind</button>
      <button id="debugNormBtn">Normals Overlay</button>
      <button id="bridgeToggleBtn" aria-pressed="false">Bridge: Off</button>
    </div>
    <pre id="irPreview"></pre>
  </aside>

  <div id="stickBase"><div id="stickKnob"></div></div>

  <div class="mobile-actions hud-interactive">
    <button id="mobileRollBtn" class="touch-action" aria-label="Barrel Roll">ROLL</button>
    <button id="mobileBoostBtn" class="touch-action boost" aria-pressed="false" aria-label="Hold for Thrusters">BOOST</button>
  </div>

  <div class="bottom-meta">
    <div class="hint-pill" id="hintBar">Point / WASD to steer · Click: barrel roll · Hold Shift: thrusters · Space: view</div>
    <div id="statsBar">Initializing WebGL2…</div>
  </div>
</main>

<script type="module" src="./bundle.js"></script>
</body>
</html>
