name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:site
      - name: Verify publishable workspace tarballs
        run: |
          npm pack --dry-run --workspace=@aastack/core
          npm pack --dry-run --workspace=@aastack/blueprint
          npm pack --dry-run --workspace=@aastack/bridge
          npm pack --dry-run --workspace=@aastack/mcp

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_aa_stacker.py

  webgl-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Install headless Chromium for WebGL2 shader smoke test
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Run WebGL2 shader & 64x instancing smoke test
        run: node tests/webgl-smoke.mjs
