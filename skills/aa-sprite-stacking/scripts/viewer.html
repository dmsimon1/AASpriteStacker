  gl.uniform1f(mp.u.uScale, effScale);
  gl.uniform1f(mp.u.uAngleRad, (angleDeg * Math.PI) / 180);
  gl.uniform1f(mp.u.uSquash, squash);
  gl.uniform1f(mp.u.uSpacing, spacing);
  gl.uniform1f(mp.u.uSlabThick, slabThick);
  gl.uniform1f(mp.u.uSdfRange, vol.sdfRange);
  gl.uniform1i(mp.u.uModeA, modeA);
  gl.uniform1i(mp.u.uModeB, modeB);
  gl.uniform1f(mp.u.uSplitX, splitX);
  gl.uniform1i(mp.u.uSamples, state.samples);
  gl.uniform1i(mp.u.uShadeStyle, state.shadeStyle);
  gl.uniform1i(mp.u.uShadowOn, state.shadow ? 1 : 0);
  gl.uniform1i(mp.u.uSelfShadowOn, state.selfShadow ? 1 : 0);
  gl.uniform3f(mp.u.uSunWorld, env.lx, env.ly, env.lz);
  gl.uniform3fv(mp.u.uShMul, env.shMul);
  gl.uniform3fv(mp.u.uMidMul, env.midMul);
  gl.uniform3fv(mp.u.uLitMul, env.litMul);
  gl.uniform1f(mp.u.uEmisGlow, env.emisGlow);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // PASS 2: Exact 2D Euclidean SDF Outline via Jump Flooding Algorithm (JFA)
  let finalSeedTex = glCtx.fbo.seedA;
  if (state.outlineWidth > 0.02) {
    const ji = glCtx.progs.jfaInit;
    gl.bindFramebuffer(gl.FRAMEBUFFER, glCtx.fbo.jfaA);
    gl.useProgram(ji.program);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, glCtx.fbo.body); gl.uniform1i(ji.u.uBodyTex, 0);
    gl.uniform2f(ji.u.uResolution, cw, ch);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    const maxRad = Math.ceil(state.outlineWidth * effScale) + 3;
    let step = 1;
    while (step * 2 < maxRad) step *= 2;
    const js = glCtx.progs.jfaStep;
    gl.useProgram(js.program);
    gl.uniform2f(js.u.uResolution, cw, ch);

    let readTex = glCtx.fbo.seedA;
    let writeFbo = glCtx.fbo.jfaB;
    let writeTex = glCtx.fbo.seedB;
    for (let s = step; s >= 1; s >>= 1) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, writeFbo);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, readTex); gl.uniform1i(js.u.uSeedTex, 0);
      gl.uniform1f(js.u.uStep, s);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      finalSeedTex = writeTex;
      if (writeFbo === glCtx.fbo.jfaB) {
        readTex = glCtx.fbo.seedB; writeFbo = glCtx.fbo.jfaA; writeTex = glCtx.fbo.seedA;
      } else {
        readTex = glCtx.fbo.seedA; writeFbo = glCtx.fbo.jfaB; writeTex = glCtx.fbo.seedB;
      }
    }
  }

  // PASS 3: Final Linear-Light Composite + SDF AA Outline + Emissive Bloom
  const cp = glCtx.progs.comp;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.useProgram(cp.program);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, glCtx.fbo.body); gl.uniform1i(cp.u.uBodyTex, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, glCtx.fbo.aux);  gl.uniform1i(cp.u.uAuxTex, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, finalSeedTex);   gl.uniform1i(cp.u.uSeedTex, 2);
  gl.uniform2f(cp.u.uResolution, cw, ch);
  gl.uniform1f(cp.u.uScale, effScale);
  gl.uniform1f(cp.u.uOutlineWidth, state.outlineWidth);
  gl.uniform3fv(cp.u.uBgSrgb, env.bg);
  gl.uniform3fv(cp.u.uShadowSrgb, env.shCol);
  gl.uniform3fv(cp.u.uOutlineSrgb, env.olCol);
  gl.uniform1f(cp.u.uEmisGlow, env.emisGlow);
  gl.uniform1i(cp.u.uTransparentBg, transparentBg ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function updateLoupe() {
  if (!state.loupe || !canvas.width || !canvas.height) return;
  const sw = 39, sh = 39;
  const sx = clamp(Math.round(state.hoverX * canvas.width - sw * 0.5), 0, Math.max(0, canvas.width - sw));
  const sy = clamp(Math.round(state.hoverY * canvas.height - sh * 0.5), 0, Math.max(0, canvas.height - sh));
  loupeCtx.imageSmoothingEnabled = false;
  loupeCtx.clearRect(0, 0, loupeCanvas.width, loupeCanvas.height);
  loupeCtx.drawImage(canvas, sx, sy, sw, sh, 0, 0, loupeCanvas.width, loupeCanvas.height);
  // Subtle crosshair
  loupeCtx.strokeStyle = "rgba(37, 99, 235, 0.55)";
  loupeCtx.lineWidth = 1;
  loupeCtx.beginPath();
  loupeCtx.moveTo(78, 0); loupeCtx.lineTo(78, 156);
  loupeCtx.moveTo(0, 78); loupeCtx.lineTo(156, 78);
  loupeCtx.stroke();
}

function syncSplitHandlePosition() {
  const sr = stage.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  if (cr.width > 0 && sr.width > 0) {
    const px = (cr.left - sr.left) + cr.width * state.splitPos;
    splitHandle.style.left = `${px.toFixed(1)}px`;
  } else {
    splitHandle.style.left = `${(state.splitPos * 100).toFixed(2)}%`;
  }
}

function syncUI() {
  const isCompare = state.view === "compare";
  splitOverlay.classList.toggle("visible", isCompare);
  els.modeA.style.display = isCompare ? "inline-block" : "none";
  els.modeALabel.style.display = isCompare ? "inline" : "none";
  els.modeBLabel.textContent = isCompare ? "Right:" : "Renderer:";

  const mA = MODE_NAMES[state.modeA];
  const mB = MODE_NAMES[state.modeB];
  const spTag = (m) => (m === 0 ? "" : ` · ${m === 2 || m === 3 ? Math.min(state.samples, 4) : state.samples}×`);
  tagLeft.textContent = `${mA}${spTag(state.modeA)}`;
  tagRight.textContent = `${mB}${spTag(state.modeB)}`;
  syncSplitHandlePosition();
  loupeBox.classList.toggle("visible", state.loupe);
}

function drawFrame() {
  if (!state.vol) return;
  const t0 = performance.now();
  const isExploded = state.view === "exploded";
  const spacing = isExploded && state.playing
    ? 1.0 + (0.5 - 0.5 * Math.cos(state.explodePhase)) * 1.8
    : state.spacing;
  const slabThick = isExploded ? Math.min(1.0, 0.85 / Math.max(spacing, 0.85)) : 1.0;
  const maxSlices = state.view === "scan" ? Math.max(1, Math.min(state.slices, Math.round(state.scanZ))) : state.slices;

  renderWebGLFrame({ spacing, slabThick, maxSlices });
  if (state.view === "compare") syncSplitHandlePosition();
  updateLoupe();

  const dtMs = performance.now() - t0;
  state.lastFrameMs = state.lastFrameMs * 0.8 + dtMs * 0.2;
  const angStr = `${Math.round(((state.angle % 360) + 360) % 360)}°`;
  const scanStr = state.view === "scan" ? ` · Z ${maxSlices}/${state.slices}` : "";
  readout.textContent = `${angStr}${scanStr} · squash ${state.squash.toFixed(2)} · spacing ${spacing.toFixed(2)} · ${state.lastFrameMs.toFixed(2)} ms/frame`;
}

// ============================================================
// ASSET LOADING (Embedded / Presets / Dropped Strip PNG)
// ============================================================
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}

function computeIdealScale(vol, view) {
  const availW = Math.max(260, (stage.clientWidth || 720) - 96);
  const topReserve = view === "compare" ? 156 : 100;
  const availH = Math.max(220, (stage.clientHeight || 540) - topReserve);
  const diagXY = Math.hypot(vol.w, vol.h);
  const maxSpacing = view === "exploded" ? 2.65 : 1.0;
  const projW = diagXY + 8;
  const projH = diagXY * 0.75 + vol.n * maxSpacing + 10;
  const fit = Math.min(availW / projW, availH / projH);
  return clamp(Math.floor(fit * 2) / 2, 2.0, 10.0);
}

function syncRangeValue(input, output, val, fmt) {
  input.value = String(val);
  output.textContent = fmt(val);
  const min = Number(input.min || 0);
  const max = Number(input.max || 100);
  if (max > min) {
    input.style.setProperty("--progress", `${(((val - min) / (max - min)) * 100).toFixed(1)}%`);
  }
}

function resetCamera() {
  drag = null;
  draggingSplit = false;
  stage.classList.remove("dragging-split");

  state.angle = 35;
  state.squash = 0.75;
  state.spacing = 1.0;
  state.sunAngle = 42;
  state.splitPos = 0.5;
  state.explodePhase = 0;
  state.scanZ = state.view === "scan" ? 1 : (state.vol ? state.vol.n : state.slices);
  state.playing = true;
  els.play.textContent = "Pause";

  if (state.vol) {
    state.scale = computeIdealScale(state.vol, state.view);
  }

  syncRangeValue(els.angle, els.angleOut, state.angle, (v) => `${Math.round(v)}°`);
  syncRangeValue(els.squash, els.squashOut, state.squash, (v) => v.toFixed(2));
  syncRangeValue(els.spacing, els.spacingOut, state.spacing, (v) => v.toFixed(2));
  syncRangeValue(els.scale, els.scaleOut, state.scale, (v) => `${v.toFixed(1)}×`);
  syncRangeValue(els.sun, els.sunOut, state.sunAngle, (v) => `${Math.round(v)}°`);
  syncUI();
  state.dirty = true;
}

function applyVolume(vol, name) {
  state.vol = vol;
  state.slices = vol.n;
  els.slices.value = String(vol.n);
  titleText.textContent = name;
  metaText.textContent = `${vol.n} slices · ${vol.w}×${vol.h}px`;
  uploadVolumeToGPU(vol);
  resetCamera();
}

async function loadStripImages(sheetImg, count, name, sdfImg = null, sdfRange = 6.0) {
  const w = Math.floor(sheetImg.width / count);
  const h = sheetImg.height;
  if (w < 1 || h < 1) return;

  const off = document.createElement("canvas");
  off.width = sheetImg.width;
  off.height = h;
  const octx = off.getContext("2d", { willReadFrequently: true });
  octx.imageSmoothingEnabled = false;
  octx.drawImage(sheetImg, 0, 0);

  const area = w * h;
  const rgba = new Uint8Array(count * area * 4);
  for (let z = 0; z < count; z++) {
    const slice = octx.getImageData(z * w, 0, w, h).data;
    rgba.set(slice, z * area * 4);
  }

  let explicitSdf = null;
  if (sdfImg && sdfImg.width === sheetImg.width && sdfImg.height === h) {
    octx.clearRect(0, 0, off.width, off.height);
    octx.drawImage(sdfImg, 0, 0);
    explicitSdf = new Float32Array(count * area);
    for (let z = 0; z < count; z++) {
      const sd = octx.getImageData(z * w, 0, w, h).data;
      const base = z * area;
      for (let i = 0; i < area; i++) {
        explicitSdf[base + i] = ((sd[i * 4] - 128.0) / 127.0) * sdfRange;
      }
    }
  }

  const vol = buildVolumePack(w, h, count, rgba, explicitSdf, sdfRange);
  applyVolume(vol, name);
}

function loadPreset(presetName) {
  state.preset = presetName;
  document.querySelectorAll("[data-preset]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.preset === presetName))
  );
  const titles = { cottage: "Cottage + 1px Weathervane", car: "Sports Car", lighthouse: "Striped Lighthouse" };
  applyVolume(makePresetVolume(presetName), titles[presetName] || presetName);
}

// ============================================================
// EFFICIENT BACKGROUND PROCESSING (content-visibility + visibilitychange)
// ============================================================
let rafId = 0;
let lastT = performance.now();

function tick(now) {
  rafId = 0;
  if (state.pausedByVisibility) return;
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (state.vol) {
    let needs = state.dirty;
    if (state.playing) {
      if (state.view === "compare" || state.view === "turntable") {
        state.angle = (state.angle + dt * 38) % 360;
        els.angle.value = state.angle.toFixed(1);
        els.angleOut.textContent = `${Math.round(state.angle)}°`;
        needs = true;
      } else if (state.view === "scan") {
        state.scanZ += dt * Math.max(8, state.slices * 0.42);
        if (state.scanZ > state.slices + 6) state.scanZ = 1;
        needs = true;
      } else if (state.view === "exploded") {
        state.explodePhase += dt * 1.5;
        state.angle = (state.angle + dt * 24) % 360;
        needs = true;
      }
    }
    if (needs) {
      drawFrame();
      state.dirty = false;
    }
  }
  rafId = requestAnimationFrame(tick);
}

function resumeLoop() {
  state.pausedByVisibility = false;
  lastT = performance.now();
  if (!rafId) rafId = requestAnimationFrame(tick);
}

function pauseLoop() {
  state.pausedByVisibility = true;
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
}

// Direct listener on content-visibility: auto element (per Modern Web Guidance)
stage.addEventListener("contentvisibilityautostatechange", (e) => {
  if (e.skipped) pauseLoop(); else resumeLoop();
});
if (!("contentVisibility" in document.documentElement.style)) {
  const io = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) resumeLoop(); else pauseLoop();
  }, { rootMargin: "200px" });
  io.observe(stage);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) pauseLoop(); else resumeLoop();
});

// ============================================================
// INTERACTIONS (Orbit, Shift+Sun, A/B Split Drag, Hover Loupe, Export)
// ============================================================
let drag = null;
let draggingSplit = false;

splitHandle.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  draggingSplit = true;
  stage.classList.add("dragging-split");
  splitHandle.setPointerCapture(e.pointerId);
});
splitHandle.addEventListener("pointermove", (e) => {
  if (!draggingSplit) return;
  const r = canvas.getBoundingClientRect();
  state.splitPos = clamp((e.clientX - r.left) / Math.max(r.width, 1), 0.05, 0.95);
  syncUI();
  state.dirty = true;
});
splitHandle.addEventListener("pointerup", () => {
  draggingSplit = false;
  stage.classList.remove("dragging-split");
});

stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".toolbar-float") || e.target.closest(".split-handle")) return;
  stage.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, angle: state.angle, squash: state.squash, sun: state.sunAngle, shift: e.shiftKey };
  if (!e.shiftKey) {
    state.playing = false;
    els.play.textContent = "Play";
  }
});
stage.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  if (r.width > 0 && r.height > 0) {
    state.hoverX = clamp((e.clientX - r.left) / r.width, 0, 1);
    state.hoverY = clamp((e.clientY - r.top) / r.height, 0, 1);
    if (state.loupe) updateLoupe();
  }
  if (!drag) return;
  if (drag.shift) {
    state.sunAngle = ((drag.sun + (e.clientX - drag.x) * 0.7) % 360 + 360) % 360;
    els.sun.value = String(Math.round(state.sunAngle));
    els.sunOut.textContent = `${Math.round(state.sunAngle)}°`;
  } else {
    state.angle = ((drag.angle + (e.clientX - drag.x) * 0.55) % 360 + 360) % 360;
    state.squash = clamp(drag.squash + (e.clientY - drag.y) * 0.0022, 0.4, 1.0);
    els.angle.value = state.angle.toFixed(1);
    els.angleOut.textContent = `${Math.round(state.angle)}°`;
    els.squash.value = state.squash.toFixed(2);
    els.squashOut.textContent = state.squash.toFixed(2);
  }
  state.dirty = true;
});
stage.addEventListener("pointerup", () => { drag = null; });

document.querySelectorAll("[data-preset]").forEach((btn) => {
  btn.addEventListener("click", () => loadPreset(btn.dataset.preset));
});
document.querySelectorAll("[data-view]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    resetCamera();
  });
});
document.querySelectorAll("[data-samples]").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.samples = Number(btn.dataset.samples);
    document.querySelectorAll("[data-samples]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    syncUI();
    state.dirty = true;
  });
});

els.modeA.addEventListener("change", () => { state.modeA = Number(els.modeA.value); syncUI(); state.dirty = true; });
els.modeB.addEventListener("change", () => { state.modeB = Number(els.modeB.value); syncUI(); state.dirty = true; });
els.shade.addEventListener("change", () => { state.shadeStyle = Number(els.shade.value); state.dirty = true; });
els.loupe.addEventListener("click", () => {
  state.loupe = !state.loupe;
  els.loupe.setAttribute("aria-pressed", String(state.loupe));
  syncUI();
  if (state.loupe) updateLoupe();
});
els.play.addEventListener("click", () => {
  state.playing = !state.playing;
  els.play.textContent = state.playing ? "Pause" : "Play";
  state.dirty = true;
});
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); els.play.click(); }
});

els.angle.addEventListener("input", () => {
  state.angle = Number(els.angle.value);
  els.angleOut.textContent = `${Math.round(state.angle)}°`;
  state.playing = false; els.play.textContent = "Play";
  state.dirty = true;
});
els.squash.addEventListener("input", () => { state.squash = Number(els.squash.value); els.squashOut.textContent = state.squash.toFixed(2); state.dirty = true; });
els.spacing.addEventListener("input", () => { state.spacing = Number(els.spacing.value); els.spacingOut.textContent = state.spacing.toFixed(2); state.dirty = true; });
els.scale.addEventListener("input", () => { state.scale = Number(els.scale.value); els.scaleOut.textContent = `${state.scale.toFixed(1)}×`; state.dirty = true; });
els.outline.addEventListener("input", () => { state.outlineWidth = Number(els.outline.value); els.outlineOut.textContent = state.outlineWidth.toFixed(2); state.dirty = true; });
els.time.addEventListener("input", () => { state.timeOfDay = Number(els.time.value); updateStageTheme(); state.dirty = true; });
els.sun.addEventListener("input", () => { state.sunAngle = Number(els.sun.value); els.sunOut.textContent = `${state.sunAngle}°`; state.dirty = true; });
els.shadow.addEventListener("change", () => { state.shadow = els.shadow.checked; state.dirty = true; });
els.selfShadow.addEventListener("change", () => { state.selfShadow = els.selfShadow.checked; state.dirty = true; });

let loadedStripImg = null;
let loadedStripName = "";
els.slices.addEventListener("change", () => {
  const n = Math.max(1, Number(els.slices.value) || 1);
  if (loadedStripImg) loadStripImages(loadedStripImg, n, loadedStripName);
});

function defaultVoxPalette() {
  const pal = new Uint8Array(256 * 4);
  const vals = [0xff, 0xcc, 0x99, 0x66, 0x33, 0x00];
  let idx = 1;
  for (let b = 0; b < 6 && idx < 216; b++) {
    for (let g = 0; g < 6 && idx < 216; g++) {
      for (let r = 0; r < 6 && idx < 216; r++) {
        pal[idx * 4 + 0] = vals[r];
        pal[idx * 4 + 1] = vals[g];
        pal[idx * 4 + 2] = vals[b];
        pal[idx * 4 + 3] = 255;
        idx++;
      }
    }
  }
  for (let i = idx; i < 256; i++) {
    const v = Math.round(((255 - i) / (256 - idx)) * 255);
    pal[i * 4 + 0] = v;
    pal[i * 4 + 1] = v;
    pal[i * 4 + 2] = v;
    pal[i * 4 + 3] = 255;
  }
  return pal;
}

function decodeVoxRotMatrix(rotByte) {
  const c0 = rotByte & 3;
  const c1 = (rotByte >> 2) & 3;
  if (c0 > 2 || c1 > 2 || c0 === c1) return [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const c2 = 3 - c0 - c1;
  const s0 = (rotByte & 16) ? -1 : 1;
  const s1 = (rotByte & 32) ? -1 : 1;
  const s2 = (rotByte & 64) ? -1 : 1;
  const m = [0, 0, 0, 0, 0, 0, 0, 0, 0];
  m[c0] = s0;
  m[3 + c1] = s1;
  m[6 + c2] = s2;
  return m;
}

function mulVoxMat3(a, b) {
  return [
    a[0] * b[0] + a[1] * b[3] + a[2] * b[6], a[0] * b[1] + a[1] * b[4] + a[2] * b[7], a[0] * b[2] + a[1] * b[5] + a[2] * b[8],
    a[3] * b[0] + a[4] * b[3] + a[5] * b[6], a[3] * b[1] + a[4] * b[4] + a[5] * b[7], a[3] * b[2] + a[4] * b[5] + a[5] * b[8],
    a[6] * b[0] + a[7] * b[3] + a[8] * b[6], a[6] * b[1] + a[7] * b[4] + a[8] * b[7], a[6] * b[2] + a[7] * b[5] + a[8] * b[8],
  ];
}

function parseVoxBuffer(buffer) {
  const view = new DataView(buffer);
  const u8 = new Uint8Array(buffer);
  if (buffer.byteLength < 20) throw new Error("Invalid .vox file: too short");
  const readStr = (off) => String.fromCharCode(u8[off], u8[off + 1], u8[off + 2], u8[off + 3]);
  if (readStr(0) !== "VOX ") throw new Error(`Invalid .vox magic: "${readStr(0)}"`);

  const readDict = (pos, limit) => {
    const dict = {};
    if (pos + 4 > limit) return { dict, next: limit };
    const n = view.getInt32(pos, true);
    let cur = pos + 4;
    for (let i = 0; i < n && cur + 4 <= limit; i++) {
      const kLen = view.getInt32(cur, true); cur += 4;
      if (kLen < 0 || cur + kLen > limit) return { dict, next: limit };
      let k = "";
      for (let j = 0; j < kLen; j++) k += String.fromCharCode(u8[cur + j]);
      cur += kLen;
      if (cur + 4 > limit) return { dict, next: limit };
      const vLen = view.getInt32(cur, true); cur += 4;
      if (vLen < 0 || cur + vLen > limit) return { dict, next: limit };
      let v = "";
      for (let j = 0; j < vLen; j++) v += String.fromCharCode(u8[cur + j]);
      cur += vLen;
      dict[k] = v;
    }
    return { dict, next: cur };
  };

  const models = [];
  const nodes = new Map();
  const referencedChildren = new Set();
  let palette = defaultVoxPalette();

  const parseChunk = (pos, limit) => {
    if (pos + 12 > limit) return limit;
    const id = readStr(pos);
    const contentBytes = view.getInt32(pos + 4, true);
    const childBytes = view.getInt32(pos + 8, true);
    const contentStart = pos + 12;
    const childStart = Math.min(limit, contentStart + Math.max(0, contentBytes));
    const chunkEnd = Math.min(limit, childStart + Math.max(0, childBytes));

    if (id === "SIZE" && contentBytes >= 12) {
      models.push({
        sx: view.getInt32(contentStart, true),
        sy: view.getInt32(contentStart + 4, true),
        sz: view.getInt32(contentStart + 8, true),
        voxels: [],
      });
    } else if (id === "XYZI" && contentBytes >= 4 && models.length > 0) {
      const target = models[models.length - 1];
      const count = view.getInt32(contentStart, true);
      for (let i = 0; i < count; i++) {
        const p = contentStart + 4 + i * 4;
        if (p + 4 > childStart) break;
        target.voxels.push([u8[p], u8[p + 1], u8[p + 2], u8[p + 3]]);
      }
    } else if (id === "RGBA" && contentBytes >= 1024) {
      const pal = new Uint8Array(256 * 4);
      for (let i = 0; i < 255; i++) {
        const src = contentStart + i * 4;
        const dst = (i + 1) * 4;
        pal[dst + 0] = u8[src + 0];
        pal[dst + 1] = u8[src + 1];
        pal[dst + 2] = u8[src + 2];
        pal[dst + 3] = u8[src + 3];
      }
      palette = pal;
    } else if (id === "nTRN" && contentBytes >= 24) {
      const nodeId = view.getInt32(contentStart, true);
      const { dict: attrs, next: p1 } = readDict(contentStart + 4, childStart);
      if (p1 + 16 <= childStart) {
        const childId = view.getInt32(p1, true);
        const numFrames = view.getInt32(p1 + 12, true);
        let tx = 0, ty = 0, tz = 0, rotByte = 0x04;
        if (numFrames > 0) {
          const { dict: f0 } = readDict(p1 + 16, childStart);
          if (f0._t) {
            const parts = f0._t.trim().split(/\s+/).map(Number);
            if (parts.length >= 3 && parts.every(Number.isFinite)) { tx = parts[0]; ty = parts[1]; tz = parts[2]; }
          }
          if (f0._r !== undefined && Number.isFinite(Number(f0._r))) rotByte = Number(f0._r) & 0xff;
        }
        nodes.set(nodeId, { kind: "trn", childId, tx, ty, tz, rotByte, hidden: attrs._hidden === "1" });
        referencedChildren.add(childId);
      }
    } else if (id === "nGRP" && contentBytes >= 8) {
      const nodeId = view.getInt32(contentStart, true);
      const { next: p1 } = readDict(contentStart + 4, childStart);
      if (p1 + 4 <= childStart) {
        const numChildren = view.getInt32(p1, true);
        const children = [];
        for (let i = 0; i < numChildren; i++) {
          const cp = p1 + 4 + i * 4;
          if (cp + 4 > childStart) break;
          const cid = view.getInt32(cp, true);
          children.push(cid);
          referencedChildren.add(cid);
        }
        nodes.set(nodeId, { kind: "grp", children });
      }
    } else if (id === "nSHP" && contentBytes >= 8) {
      const nodeId = view.getInt32(contentStart, true);
      const { next: p1 } = readDict(contentStart + 4, childStart);
      if (p1 + 4 <= childStart) {
        const numModels = view.getInt32(p1, true);
        const modelIds = [];
        let cur = p1 + 4;
        for (let i = 0; i < numModels && cur + 4 <= childStart; i++) {
          modelIds.push(view.getInt32(cur, true));
          cur = readDict(cur + 4, childStart).next;
        }
        nodes.set(nodeId, { kind: "shp", modelIds });
      }
    }

    let cPos = childStart;
    while (cPos < chunkEnd) {
      const next = parseChunk(cPos, chunkEnd);
      if (next <= cPos) break;
      cPos = next;
    }
    return chunkEnd;
  };

  let offset = 8;
  while (offset < buffer.byteLength) {
    const next = parseChunk(offset, buffer.byteLength);
    if (next <= offset) break;
    offset = next;
  }
  if (models.length === 0 || models[0].sx <= 0 || models[0].sy <= 0 || models[0].sz <= 0) {
    throw new Error("Invalid .vox file: missing SIZE chunk");
  }

  let sizeX = 0, sizeY = 0, sizeZ = 0, finalVoxels = [];
  if (nodes.size === 0) {
    sizeX = models[0].sx; sizeY = models[0].sy; sizeZ = models[0].sz;
    finalVoxels = models[0].voxels;
  } else {
    const placed = [];
    let minX = Infinity, minY = Infinity, minZ = Infinity;
    let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    let shapeCount = 0, hasRotation = false, lastModelIdx = 0;
    const visit = (nodeId, rot, tx, ty, tz, depth) => {
      if (depth > 32) return;
      const node = nodes.get(nodeId);
      if (!node) return;
      if (node.kind === "trn") {
        if (node.hidden) return;
        const ntx = tx + rot[0] * node.tx + rot[1] * node.ty + rot[2] * node.tz;
        const nty = ty + rot[3] * node.tx + rot[4] * node.ty + rot[5] * node.tz;
        const ntz = tz + rot[6] * node.tx + rot[7] * node.ty + rot[8] * node.tz;
        const nrot = mulVoxMat3(rot, decodeVoxRotMatrix(node.rotByte));
        if (node.rotByte !== 0x04) hasRotation = true;
        visit(node.childId, nrot, ntx, nty, ntz, depth + 1);
      } else if (node.kind === "grp") {
        for (const cid of node.children) visit(cid, rot, tx, ty, tz, depth + 1);
      } else if (node.kind === "shp") {
        const mid = node.modelIds[0];
        const m = mid !== undefined ? models[mid] : undefined;
        if (!m) return;
        shapeCount++; lastModelIdx = mid;
        const cx = Math.floor(m.sx / 2), cy = Math.floor(m.sy / 2), cz = Math.floor(m.sz / 2);
        for (const [vx, vy, vz, ci] of m.voxels) {
          if (ci === 0) continue;
          const lx = vx - cx, ly = vy - cy, lz = vz - cz;
          const wx = Math.round(tx + rot[0] * lx + rot[1] * ly + rot[2] * lz);
          const wy = Math.round(ty + rot[3] * lx + rot[4] * ly + rot[5] * lz);
          const wz = Math.round(tz + rot[6] * lx + rot[7] * ly + rot[8] * lz);
          if (wx < minX) minX = wx; if (wx > maxX) maxX = wx;
          if (wy < minY) minY = wy; if (wy > maxY) maxY = wy;
          if (wz < minZ) minZ = wz; if (wz > maxZ) maxZ = wz;
          placed.push([wx, wy, wz, ci]);
        }
      }
    };
    const roots = Array.from(nodes.keys()).filter((id) => !referencedChildren.has(id));
    for (const rootId of roots.length > 0 ? roots : [0]) visit(rootId, [1, 0, 0, 0, 1, 0, 0, 0, 1], 0, 0, 0, 0);
    if (placed.length === 0 || (shapeCount === 1 && !hasRotation)) {
      const m = models[shapeCount === 1 ? lastModelIdx : 0];
      sizeX = m.sx; sizeY = m.sy; sizeZ = m.sz; finalVoxels = m.voxels;
    } else {
      sizeX = Math.min(256, maxX - minX + 1);
      sizeY = Math.min(256, maxY - minY + 1);
      sizeZ = Math.min(128, maxZ - minZ + 1);
      finalVoxels = placed.map(([wx, wy, wz, ci]) => [wx - minX, wy - minY, wz - minZ, ci]);
    }
  }

  const area = sizeX * sizeY;
  const rgba = new Uint8Array(sizeZ * area * 4);
  for (const [vx, vy, vz, ci] of finalVoxels) {
    if (vx < 0 || vy < 0 || vz < 0 || vx >= sizeX || vy >= sizeY || vz >= sizeZ || ci === 0) continue;
    const idx = vz * area + (sizeY - 1 - vy) * sizeX + vx;
    const p = idx * 4;
    const cp = ci * 4;
    rgba[p + 0] = palette[cp + 0];
    rgba[p + 1] = palette[cp + 1];
    rgba[p + 2] = palette[cp + 2];
    rgba[p + 3] = palette[cp + 3] || 255;
  }
  return buildVolumePack(sizeX, sizeY, sizeZ, rgba, null, 6.0);
}

async function handleFile(file) {
  const baseName = file.name.replace(/\.[^.]+$/, "");
  if (file.name.toLowerCase().endsWith(".vox")) {
    try {
      const buf = await file.arrayBuffer();
      const vol = parseVoxBuffer(buf);
      loadedStripImg = null;
      loadedStripName = baseName;
      document.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", "false"));
      applyVolume(vol, `${baseName} (.vox)`);
    } catch (err) {
      metaText.textContent = `VOX error: ${err instanceof Error ? err.message : String(err)}`;
    }
    return;
  }
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  loadedStripImg = img;
  loadedStripName = baseName;
  // Heuristic: guess square-ish slice count when width >= 2 * height
  const guessed = img.height > 0 && img.width >= img.height * 2
    ? Math.max(1, Math.round(img.width / img.height))
    : state.slices;
  document.querySelectorAll("[data-preset]").forEach((b) => b.setAttribute("aria-pressed", "false"));
  await loadStripImages(img, guessed, loadedStripName);
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});
window.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
window.addEventListener("dragleave", (e) => { if (e.target === document.documentElement) document.body.classList.remove("dragging"); });
window.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

// Export transparent 16-direction AA sprite sheet directly from GPU!
els.exportBtn.addEventListener("click", () => {
  if (!state.vol || !glCtx.ready) return;
  const dirs = 16;
  const expScale = Math.max(2, Math.min(4, Math.round(state.scale / 2)));
  const frames = [];
  for (let i = 0; i < dirs; i++) {
    renderWebGLFrame({
      angleDeg: (i * 360) / dirs,
      scale: expScale,
      splitX: -1.0,
      modeB: state.modeB,
      transparentBg: true,
      dpr: 1,
    });
    const c = document.createElement("canvas");
    c.width = canvas.width;
    c.height = canvas.height;
    c.getContext("2d").drawImage(canvas, 0, 0);
    frames.push(c);
  }
  const fw = frames[0].width, fh = frames[0].height;
  const out = document.createElement("canvas");
  out.width = fw * dirs;
  out.height = fh;
  const octx = out.getContext("2d");
  frames.forEach((f, i) => octx.drawImage(f, i * fw, 0));
  const a = document.createElement("a");
  a.download = `${titleText.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-16dir-aa.png`;
  a.href = out.toDataURL("image/png");
  a.click();
  state.dirty = true;
});

async function init() {
  initWebGL2();
  updateStageTheme();
  syncUI();
  if (EMBEDDED) {
    document.getElementById("presetGroup").style.display = "none";
    const sheetImg = await loadImage(EMBEDDED.sheet);
    const sdfImg = EMBEDDED.sdfSheet ? await loadImage(EMBEDDED.sdfSheet) : null;
    loadedStripImg = sheetImg;
    loadedStripName = EMBEDDED.title || "Custom Stack";
    await loadStripImages(sheetImg, EMBEDDED.slices, loadedStripName, sdfImg, EMBEDDED.sdfRange || 6.0);
  } else {
    loadPreset("cottage");
  }
  resumeLoop();
}
init();
</script>
